[project]
name = "py-habit-tracker"
version = "0.1.0"
description = "Day 010 of 100 Days of Python: a habit tracker with streaks, a month calendar and a GitHub-style heatmap in your terminal"
readme = "README.md"
authors = [
    { name = "mchamow", email = "michalchamow@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
habit = "py_habit_tracker:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
