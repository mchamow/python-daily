[project]
name = "py-log-analyzer"
version = "0.1.0"
description = "Day 012 of 100 Days of Python: stream huge (even compressed) access logs in constant memory and report errors, slow endpoints, top IPs and incidents"
readme = "README.md"
authors = [
    { name = "mchamow", email = "michalchamow@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
logscan = "py_log_analyzer:main"
loggen = "py_log_analyzer.generate:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
